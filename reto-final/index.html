<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Client</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>API CLIENT</h1>
    <div class="request">
      <label for="metodo">Método:</label>
      <select id="metodo">
        <option value="GET">GET</option>
        <option value="POST">POST</option>
        <option value="PUT">PUT</option>
        <option value="DELETE">DELETE</option>
      </select>
      <label for="url">URL:</label>
      <input type="url" id="url" placeholder="https://ejemplo.com/recurso" required>
      <button onclick="ejecutarSolicitud()">EJECUTAR</button>
    </div>
    <div class="body-section">
      <label for="body">Body (JSON):</label>
      <textarea id="body" placeholder='{"name":"Ejemplo"}'></textarea>
      <p id="mensaje-body" class="info"></p>
    </div>
    <div class="response">
      <h2>STATUS: <span id="status">--</span></h2>
      <h3>Tiempo de respuesta: <span id="time">-- ms</span></h3>
      <h3>RESPONSE:</h3>
      <pre id="output">{}</pre>
      <p id="error" class="error"></p>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
